<!doctype html>
<!-- The Lean infoview (goal panel), loaded in an iframe by src/lean/infoview.ts. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Infoview</title>
    <link rel="stylesheet" href="/infoview/index.css" />
    <style>
      /* Webview defaults the infoview expects, after VS Code's webview page.
         The --vscode-* colours are copied in from Monaco by InfoviewHost. */
      html {
        scrollbar-color: var(--vscode-scrollbarSlider-background) var(--vscode-editor-background);
      }
      body {
        margin: 0;
        padding: 0 12px;
        background-color: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        overscroll-behavior-x: none;
        --vscode-font-family: Inter, "Segoe UI", system-ui, sans-serif;
        --vscode-font-size: 13px;
        --vscode-font-weight: normal;
        --vscode-editor-font-family: "JuliaMono", Consolas, monospace;
        --vscode-editor-font-size: 14px;
        --vscode-editor-font-weight: normal;
      }
      a,
      a code {
        color: var(--vscode-textLink-foreground);
      }
      a:hover {
        color: var(--vscode-textLink-activeForeground);
      }
      a.link.pointer {
        cursor: pointer;
      }
      code {
        font-family: var(--vscode-editor-font-family);
        color: var(--vscode-textPreformat-foreground);
        background-color: var(--vscode-textPreformat-background);
        padding: 1px 3px;
        border-radius: 4px;
      }
      pre code {
        padding: 0;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--vscode-scrollbarSlider-background);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--vscode-scrollbarSlider-hoverBackground);
      }
      .pre-wrap {
        padding-bottom: 1.5em;
      }
      /* Settings are not persisted, so hide "save as default". */
      .saveConfigButton,
      .saveConfigLineBreak {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="react_root"></div>
    <script type="module" src="/src/lean/frame.ts"></script>
  </body>
</html>
