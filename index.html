<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leanlings</title>
    <!-- Loader styles live here (not in App.css) so they apply before any JS
         loads. The React loading screen (src/Loading.tsx) reuses them. -->
    <style>
      :root {
        --ld-bg: #f7f7f8;
        --ld-card: #ffffff;
        --ld-border: #e2e2e6;
        --ld-text: #1d1d22;
        --ld-muted: #6b6b76;
        --ld-accent: #3b6fd8;
        --ld-good: #1f8a4c;
        --ld-bad: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ld-bg: #1b1b1f;
          --ld-card: #232328;
          --ld-border: #34343b;
          --ld-text: #e6e6ea;
          --ld-muted: #9a9aa5;
          --ld-accent: #7aa2f7;
          --ld-good: #4cc38a;
          --ld-bad: #f07167;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ld-bg);
        color: var(--ld-text);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ld-bg);
        transition: opacity 0.35s;
      }
      .loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-card {
        width: min(440px, calc(100% - 32px));
        padding: 28px 28px 22px;
        border: 1px solid var(--ld-border);
        border-radius: 14px;
        background: var(--ld-card);
      }
      .loader-title {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .loader-title img {
        width: 36px;
        height: 36px;
      }
      .loader-title h1 {
        margin: 0;
        font-size: 20px;
      }
      .loader-overall {
        height: 4px;
        border-radius: 2px;
        background: var(--ld-border);
        overflow: hidden;
        margin-bottom: 18px;
      }
      .loader-overall div {
        height: 100%;
        background: var(--ld-accent);
        transition: width 0.25s;
      }
      .loader-steps {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .loader-step {
        display: grid;
        grid-template-columns: 20px 1fr auto;
        column-gap: 10px;
        align-items: baseline;
        padding: 6px 0;
        color: var(--ld-muted);
      }
      .loader-step.active,
      .loader-step.done {
        color: var(--ld-text);
      }
      .loader-step.error {
        color: var(--ld-bad);
      }
      .loader-icon {
        text-align: center;
      }
      .loader-step.done .loader-icon {
        color: var(--ld-good);
      }
      .loader-time {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--ld-muted);
      }
      .loader-detail {
        grid-column: 2 / 4;
        font-size: 12px;
        color: var(--ld-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .loader-step.error .loader-detail {
        white-space: normal;
        color: var(--ld-bad);
      }
      .loader-bar {
        grid-column: 2 / 4;
        height: 3px;
        margin-top: 4px;
        border-radius: 2px;
        background: var(--ld-border);
        overflow: hidden;
      }
      .loader-bar div {
        height: 100%;
        background: var(--ld-accent);
        transition: width 0.2s;
      }
      .spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid var(--ld-border);
        border-top-color: var(--ld-accent);
        border-radius: 50%;
        animation: ld-spin 0.8s linear infinite;
      }
      @keyframes ld-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loader-actions {
        margin-top: 16px;
        text-align: right;
      }
      .loader-actions button {
        padding: 6px 14px;
        border: 1px solid var(--ld-border);
        border-radius: 6px;
        background: var(--ld-bg);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .loader-actions button + button {
        margin-left: 8px;
      }
      .loader-actions button.primary {
        border-color: var(--ld-accent);
        background: var(--ld-accent);
        color: var(--ld-card);
      }
      .loader-prompt {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--ld-border);
      }
      .loader-prompt p {
        margin: 0;
        line-height: 1.45;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Shown until React mounts; replaced by the React loading screen. -->
      <div class="loader">
        <div class="loader-card">
          <div class="loader-title">
            <img src="/favicon.png" alt="" />
            <h1>Leanlings</h1>
          </div>
          <div class="loader-overall"><div style="width: 5%"></div></div>
          <ul class="loader-steps">
            <li class="loader-step active">
              <span class="loader-icon"><span class="spinner"></span></span>
              <span>Loading app code</span>
              <span class="loader-time" id="boot-time"></span>
              <span class="loader-detail" id="boot-detail">Starting…</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <script>
      // Live feedback while the JS bundle loads: count fetched files and show
      // the latest one. window.__bootStats is picked up by the React loader.
      (function () {
        var start = performance.now();
        var stats = (window.__bootStats = { files: 0, bytes: 0, start: start });
        var detail = document.getElementById("boot-detail");
        var time = document.getElementById("boot-time");
        function kb(n) {
          return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
        }
        try {
          new PerformanceObserver(function (list) {
            list.getEntries().forEach(function (e) {
              stats.files++;
              stats.bytes += e.transferSize || e.decodedBodySize || 0;
              if (detail) {
                var name = e.name.split("?")[0].split("/").pop();
                detail.textContent = stats.files + " files · " + kb(stats.bytes) + " · " + name;
              }
            });
          }).observe({ type: "resource", buffered: true });
        } catch (e) {}
        var timer = setInterval(function () {
          if (!document.getElementById("boot-time")) return clearInterval(timer);
          time.textContent = ((performance.now() - start) / 1000).toFixed(1) + "s";
        }, 100);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
