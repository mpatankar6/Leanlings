# ── Exercises ────────────────────────────────────────────────────────────

[[exercise]]
id = "ch01_rfl"
chapter = "ch01"
title = "Hello, rfl"
path = "Exercises/01_hello/rfl.lean"
theorem = "two_plus_two"
statement = "2 + 2 = 4"
description = "Look at the finished example first, then prove that `2 + 2 = 4`."
hint = "Do what the example above does: replace `sorry` with `rfl`."

[[exercise]]
id = "ch01_compute"
chapter = "ch01"
title = "Computation counts"
path = "Exercises/01_hello/compute.lean"
theorem = "seven_times_two"
statement = "(3 + 4) * 2 = 10 + 4"
description = "Both sides of this equation involve arithmetic, on both the left and the right."
hint = "Which tactic proved `2 + 2 = 4`? It computes *both* sides before comparing them."

[[exercise]]
id = "ch01_exact"
chapter = "ch01"
title = "Using a hypothesis"
path = "Exercises/01_hello/exact.lean"
theorem = "use_hypothesis"
statement = "∀ (P Q : Prop), P → Q → Q"
description = "The goal isn't an equation this time, so `rfl` won't help. Look at your [[hypothesis|hypotheses]]."
hint = "The goal is `Q`. Which hypothesis has type `Q`? Write `exact` followed by its name."

[[exercise]]
id = "ch01_reuse"
chapter = "ch01"
title = "Reuse a theorem"
path = "Exercises/01_hello/reuse.lean"
theorem = "big_square"
statement = "10 * 10 = 100"
description = "A theorem you've proved is a proof you can hand to `exact`. Use `hundred` instead of computing again."
hint = "`hundred` has type `10 * 10 = 100`, which is exactly the goal."

[[exercise]]
id = "ch01_fix"
chapter = "ch01"
title = "Read the error"
path = "Exercises/01_hello/fix.lean"
theorem = "pick_the_right_one"
statement = "∀ (P Q R : Prop), P → Q → R → R"
description = "This proof has a mistake. Read Lean's error message: it tells you what was given and what was expected."
hint = "Compare the type in the error message with the goal. Which hypothesis has the type the goal needs?"
